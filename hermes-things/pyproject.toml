[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hermes-things"
version = "0.1.0"
description = "Hermes agent 'things' — Chris Lori strategy orchestrator"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hermes = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes*"]
